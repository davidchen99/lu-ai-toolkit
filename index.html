<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陆同学AI工具集</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --text: #2D2A26;
      --text-muted: #8A8279;
      --accent: #C4A484;
      --accent-dark: #A68B6A;
      --border: #E8E3DC;
      --shadow: rgba(45, 42, 38, 0.06);
      --design: linear-gradient(135deg, #E8D5C4 0%, #C4A484 100%);
      --tech: linear-gradient(135deg, #D4DEE8 0%, #7BA3C4 100%);
      --biz: linear-gradient(135deg, #E8E4D4 0%, #C4B484 100%);
      --office: linear-gradient(135deg, #D4E8D8 0%, #7BC49B 100%);
      --human: linear-gradient(135deg, #E8D4D4 0%, #C48484 100%);
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--card-bg);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .module-tabs {
      display: inline-flex;
      gap: 0.25rem;
      margin-top: 1.2rem;
      padding: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
    }

    .module-tab {
      font-family: inherit;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.55rem 1rem;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .module-tab:hover { color: var(--accent-dark); }
    .module-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 18px rgba(196, 164, 132, 0.22);
    }

    /* Search */
    .search-wrap {
      max-width: 600px;
      margin: 1.5rem auto 0;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1.2rem 0.9rem 3rem;
      border: 1px solid var(--border);
      border-radius: 50px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--bg);
      transition: all 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 164, 132, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Filter Bar */
    .filter-bar {
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: inherit;
      padding: 0.5rem 1.2rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.25s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .control-select {
      min-width: 148px;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .control-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 164, 132, 0.12);
    }

    .filter-toggle {
      display: none;
    }

    /* Main Grid */
    main { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }

    .masonry {
      columns: 4;
      column-gap: 1.2rem;
    }

    @media (max-width: 1100px) { .masonry { columns: 3; } }
    @media (max-width: 800px) { .masonry { columns: 2; } }
    @media (max-width: 500px) { .masonry { columns: 2; column-gap: 0.8rem; } main { padding: 1rem 0.8rem; } }

    /* Card */
    .card {
      break-inside: avoid;
      margin-bottom: 1.2rem;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
      transition: transform 0.3s, box-shadow 0.3s;
      display: inline-block;
      width: 100%;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(45, 42, 38, 0.12);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 1rem; }

    .card-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; }

    .card-tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 50px;
      background: var(--bg);
      color: var(--text-muted);
    }

    .card-tag.primary { background: var(--accent); color: #fff; }

    .level-badge {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      z-index: 2;
      border-radius: 999px;
      padding: 0.22rem 0.55rem;
      background: rgba(255,255,255,0.86);
      color: var(--accent-dark);
      font-size: 0.68rem;
      box-shadow: 0 2px 10px rgba(45, 42, 38, 0.1);
    }

    .level-featured { background: rgba(196, 164, 132, 0.92); color: #fff; }
    .level-common { background: rgba(212, 232, 216, 0.92); color: #4f8063; }
    .level-pending { background: rgba(232, 228, 212, 0.94); color: #8a7a4f; }
    .level-archived { background: rgba(232, 212, 212, 0.94); color: #946161; }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
    }

    .card-stars { color: var(--accent); font-size: 0.8rem; letter-spacing: 2px; }
    .card-link {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      color: var(--accent);
      text-decoration: none;
      padding: 0;
    }
    .card-link:hover { color: var(--accent-dark); text-decoration: underline; }

    .section {
      margin-bottom: 1.8rem;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .section-desc {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .featured-grid,
    .scene-nav,
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    .featured-grid .card,
    .scene-grid .card {
      margin-bottom: 0;
    }

    .scene-card {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.72);
      border-radius: 14px;
      box-shadow: 0 2px 12px var(--shadow);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      padding: 1rem;
      text-align: left;
      transition: all 0.25s;
      min-height: 116px;
    }

    .scene-card:hover,
    .scene-card.active {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(45, 42, 38, 0.1);
    }

    .scene-card.active {
      background: rgba(196, 164, 132, 0.12);
    }

    .scene-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .scene-desc {
      color: var(--text-muted);
      font-size: 0.76rem;
      line-height: 1.55;
    }

    .scene-results {
      display: none;
    }

    .scene-results.active {
      display: block;
    }

    .scene-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 2px 12px var(--shadow);
      padding: 1rem 1.2rem;
    }

    .scene-reset {
      flex-shrink: 0;
    }

    .maintenance-section {
      display: none;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 2px 12px var(--shadow);
      padding: 1rem;
      margin-bottom: 1.8rem;
    }

    .maintenance-section.active {
      display: block;
    }

    .maintenance-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
      margin: 0.8rem 0 1rem;
    }

    .maintenance-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      padding: 0.8rem;
    }

    .maintenance-label {
      color: var(--text-muted);
      font-size: 0.72rem;
      margin-bottom: 0.35rem;
    }

    .maintenance-value {
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 500;
      word-break: break-word;
    }

    .maintenance-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
      margin-top: 0.8rem;
    }

    .maintenance-record {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 0.7rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .maintenance-record strong {
      display: block;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    /* Empty / Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .stat-item {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      text-align: center;
      box-shadow: 0 2px 12px var(--shadow);
    }

    .stat-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-dark);
      line-height: 1;
    }

    .stat-label {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .empty { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .modal.active { display: flex; }
    .modal-box {
      max-width: 700px;
      max-height: min(86vh, 760px);
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
    }
    .modal-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .modal-info { padding: 1.5rem; }
    .modal-title { font-family: 'Noto Serif SC', serif; font-size: 1.3rem; margin-bottom: 0.5rem; }
    .modal-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.7; white-space: pre-wrap; }

    .modal-scroll { overflow: auto; }

    .detail-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0.8rem 0;
    }

    .detail-label {
      margin-top: 1rem;
      margin-bottom: 0.4rem;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .detail-link,
    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--accent-dark);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      padding: 0.42rem 0.8rem;
      text-decoration: none;
      transition: all 0.2s;
    }

    .detail-link:hover,
    .copy-btn:hover {
      border-color: var(--accent);
      background: rgba(196, 164, 132, 0.12);
    }

    .prompt-box {
      margin-top: 0.8rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.6rem;
      transform: translateX(-50%) translateY(20px);
      background: rgba(45, 42, 38, 0.88);
      color: #fff;
      border-radius: 999px;
      padding: 0.65rem 1rem;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 1200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 720px) {
      header { padding: 1.6rem 1rem 1.2rem; }
      header h1 { font-size: 1.45rem; }
      .module-tabs { width: 100%; overflow-x: auto; justify-content: flex-start; }
      .module-tab { flex: 1; padding: 0.5rem 0.75rem; }
      .filter-bar { padding: 0.8rem; justify-content: flex-start; }
      .control-select, .filter-btn { flex: 1 1 42%; min-width: 0; }
      .filter-toggle { display: block; flex: 1 1 100%; }
      .filter-bar.collapsed .control-select,
      .filter-bar.collapsed #clearFilters,
      .filter-bar.collapsed #maintenanceToggle {
        display: none;
      }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .featured-grid, .scene-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .scene-nav { grid-template-columns: 1fr; }
      .maintenance-grid, .maintenance-list { grid-template-columns: 1fr; }
      .section-head, .scene-banner { align-items: flex-start; flex-direction: column; }
      .modal { padding: 0.8rem; }
    }
  </style>
</head>

    <p id="moduleDesc">工具、工作流与提示词资产库</p>
    <div class="module-tabs" id="moduleTabs">
      <button class="module-tab active" data-module="tools">工具库</button>
      <button class="module-tab" data-module="workflows">技巧工作流</button>
      <button class="module-tab" data-module="prompts">提示词 & Skill</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索名称、场景、内容...">
    </div>
  </header>

  <div class="filter-bar collapsed" id="controlBar">
    <button class="filter-btn filter-toggle" id="filterToggle">展开筛选</button>
    <select class="control-select" id="typeFilter"></select>
    <select class="control-select" id="tagFilter"></select>
    <select class="control-select" id="ratingFilter"></select>
    <select class="control-select" id="sortSelect"></select>
    <button class="filter-btn" id="clearFilters">清空筛选</button>
    <button class="filter-btn" id="maintenanceToggle">维护状态</button>
  </div>

  <main>
    <div class="stats" id="stats"></div>
    <section class="section" id="featuredSection">
      <div class="section-head">
        <div>
          <h2 class="section-title">陆同学精选</h2>
          <p class="section-desc">优先展示评分高、信息完整、场景明确的内容</p>
        </div>
      </div>
      <div class="featured-grid" id="featuredGrid"></div>
    </section>
    <section class="section" id="sceneSection">
      <div class="section-head">
        <div>
          <h2 class="section-title">按场景开始</h2>
          <p class="section-desc">从任务出发聚合工具、工作流和提示词</p>
        </div>
      </div>
      <div class="scene-nav" id="sceneNav"></div>
    </section>
    <section class="section scene-results" id="sceneResults"></section>
    <section class="maintenance-section" id="maintenanceSection"></section>
    <section class="section" id="listSection">
      <div class="section-head">
        <div>
          <h2 class="section-title" id="listTitle">工具库</h2>
          <p class="section-desc" id="listMeta">全部工具</p>
        </div>
      </div>
      <div class="masonry" id="grid"></div>
      <div class="empty" id="empty" style="display:none;">
        <div class="empty-icon">🔍</div>
        <p>未找到匹配的工具</p>
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalHero"></div>
      <div class="modal-scroll">
        <div class="modal-info" id="modalInfo"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">已复制</div>

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function cleanText(value) {
      return String(value || '').trim();
    }

    function stripMarkdownLink(value) {
      return cleanText(value).replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
    }

    function normalizeName(value) {
      const text = stripMarkdownLink(value);
      const fixes = {
        'cloud flare': 'Cloudflare',
        'github': 'GitHub',
        'claud code': 'Claude Code',
        'olama': 'ollama',
        'superbase': 'Supabase'
      };
      const key = text.toLowerCase();
      return fixes[key] || text;
    }

    function normalizeUrl(url) {
      return cleanText(url).replace(/[);，。]+$/g, '');
    }

    function normalizeDate(value) {
      const text = cleanText(value);
      return text ? text.slice(0, 10) : '';
    }

    function compactList(list) {
      return Array.from(new Set((list || []).map(cleanText).filter(Boolean)));
    }

    function normalizeForMatch(value) {
      return cleanText(value).toLowerCase().replace(/\s+/g, '').replace(/[&/｜|_-]/g, '');
    }

    function canonicalTag(value) {
      const text = cleanText(value);
      const key = normalizeForMatch(text);
      const aliases = {
        'ai编程': 'AI 编程',
        'a编程': 'AI 编程',
        '文生程序': 'AI 编程',
        'agent': '智能体',
        'aiagent': '智能体',

        '信息可视化表达': '信息可视化',
        '文生ppt': '文生 PPT',
        '文本翻译': '翻译',
        '语言翻译': '翻译',
        'ai快速学知识': '学习与知识库',
        '个人知识库': '学习与知识库',
        '大语言模型的平台': '大语言模型平台',
        'mcp服务': 'MCP',
        'github': 'GitHub',
        '云服务器': '云部署'
      };
      return aliases[key] || text;
    }

    function canonicalList(list) {
      return compactList((list || []).map(canonicalTag));
    }

    function dateAgeDays(dateText) {
      const date = new Date(normalizeDate(dateText) + 'T00:00:00+08:00');
      if (Number.isNaN(date.getTime())) return 0;
      const today = new Date('2026-06-17T00:00:00+08:00');
      return Math.floor((today - date) / 86400000);
    }

    function completenessScore(values) {
      const checks = values.map(value => {
        if (Array.isArray(value)) return value.length > 0;
        if (typeof value === 'number') return value > 0;
        return Boolean(cleanText(value));
      });
      return Math.round((checks.filter(Boolean).length / checks.length) * 100);
    }

    function classifyLevel(item) {
      if (manualFeatured.has(item.uid)) return '精选';
      if (item.date && dateAgeDays(item.date) > 365) return '归档';
      if (item.status && /未使用|尝试未成功/.test(item.status)) return '待验证';
      if (!item.rating && item.module !== 'workflows') return '待验证';
      if (item.completenessScore >= 72 && item.rating >= 4) return '精选';
      if (item.module === 'workflows' && item.completenessScore >= 72) return '常用';
      if (item.completenessScore >= 58 && item.rating >= 3) return '常用';
      return '待验证';
    }

    function levelClass(level) {
      return {
        '精选': 'level-featured',
        '常用': 'level-common',
        '待验证': 'level-pending',
        '归档': 'level-archived'
      }[level] || '';
    }

    function rankScore(item) {
      const levelWeight = { '精选': 400, '常用': 250, '待验证': 80, '归档': 10 }[item.level] || 0;
      return levelWeight + (item.rating || 0) * 25 + item.completenessScore;
    }

    function refreshLevels() {
      allItems().forEach(item => {

    function getStars(rating) {

    function buildLink(url, label) {
      const cleanUrl = normalizeUrl(url);
      if (!cleanUrl) return '';
      const safeUrl = escapeHTML(cleanUrl);
      return '<a class="detail-link" href="' + safeUrl + '" target="_blank" rel="noopener">' + escapeHTML(label || '打开链接') + '</a>';
    }

    function normalizeTools(source = allVideos) {
      return source
        .filter(item => cleanText(item.name) || cleanText(item.description))
        .map(item => {
          const type = cleanText(item.type) || '未分类';
          const category = canonicalTag(item.category);
          const title = normalizeName(item.name || category || '未命名工具');
          const description = cleanText(item.description);
          const normalized = {
            uid: 'tools-' + item.id,
            module: 'tools',
            title,
            description,
            type,
            tags: canonicalList([category]),
            filterGroups: compactList([type]),
            filterTags: canonicalList([category]),
            rating: Number(item.rating) || 0,
            date: normalizeDate(item.updateTime),
            status: cleanText(item.usageStatus),
            links: compactList([item.url, ...(item.tutorialLinks || [])]),
            searchText: [title, description, type, category].join(' ').toLowerCase()
          };
          normalized.completenessScore = completenessScore([title, description, type, category, normalized.links, normalized.rating, normalized.date]);
          normalized.level = classifyLevel(normalized);
          return normalized;
        });
    }

    function normalizeWorkflows(source = rawWorkflows) {
      return source.map(item => {

        normalized.completenessScore = completenessScore([title, normalized.date, description, software, scenarios, normalized.links]);
        normalized.level = classifyLevel(normalized);
        return normalized;
      });
    }

    function normalizePrompts(source = rawPrompts) {
      return source.map(item => {
        const title = cleanText(item.title || item.prompt).slice(0, 80);
        const description = cleanText(item.prompt);
        const types = canonicalList(item.types);

          rating: Number(item.rating) || 0,

          status,
          author: cleanText(item.author),
          links: [],
          searchText: [title, description, item.author, ...types, status].join(' ').toLowerCase()

        normalized.completenessScore = completenessScore([title, description, types, normalized.author, normalized.rating || status]);
        normalized.level = classifyLevel(normalized);

    async function loadRemoteResources() {
      const warnings = [];
      try {
        for (const endpoint of resourceEndpoints()) {
          try {
            const response = await fetch(endpoint, { cache: 'no-store' });
            const payload = await response.json().catch(() => null);
            if (!response.ok) {
              warnings.push(payload && payload.error ? payload.error : endpoint + ' 返回 ' + response.status);
              continue;
            }
            const data = payload && payload.data;
            if (!data || !Array.isArray(data.tools)) {
              warnings.push(endpoint + ' 数据格式不可用');
              continue;
            }
            syncStatus = {
              source: payload.source || '远程同步',
              syncedAt: data.syncedAt || '',
              warning: payload.warning || '',
              endpoint
            };
            dataStore = {
              tools: normalizeTools(data.tools || []),
              workflows: normalizeWorkflows(data.workflows || []),
              prompts: normalizePrompts(data.prompts || [])
            };
            render();
            return;
          } catch (error) {
            warnings.push(endpoint + ' 暂不可用');
          }
        }
      } catch (error) {
        warnings.push('远程同步请求异常');
      }
      syncStatus.warning = warnings.length
        ? '远程同步暂不可用，已使用内置静态数据；' + Array.from(new Set(warnings)).join('；')
        : '远程同步暂不可用，已使用内置静态数据';
      console.info('使用内置静态数据，远程同步暂不可用。');
      renderMaintenance();
    }

    function getFilteredItems() {
      let items = [...dataStore[state.module]];
      if (state.type !== 'all') items = items.filter(item => item.filterGroups.includes(state.type));
      if (state.tag !== 'all') items = items.filter(item => item.filterTags.includes(state.tag));
      if (state.rating !== 'all') {
        if (state.rating === 'unrated') items = items.filter(item => !item.rating);
        else items = items.filter(item => item.rating >= Number(state.rating));
      }
      if (state.query) {
        const q = state.query.toLowerCase();
        items = items.filter(item => item.searchText.includes(q));
      }

      items.sort((a, b) => {
        if (state.sort === 'rating') return (b.rating || 0) - (a.rating || 0) || (b.date || '').localeCompare(a.date || '');
        if (state.sort === 'latest') return (b.date || '').localeCompare(a.date || '') || (b.rating || 0) - (a.rating || 0);
        if (state.sort === 'name') return a.title.localeCompare(b.title, 'zh-CN');
        if (state.module === 'workflows') return (b.date || '').localeCompare(a.date || '');
        return rankScore(b) - rankScore(a) || (b.date || '').localeCompare(a.date || '');
      });
      return items;
    }

    function getFeaturedItems() {

        ...dataStore.workflows.filter(item => item.level !== '待验证').sort((a, b) => rankScore(b) - rankScore(a)).slice(0, 3),
        ...dataStore.prompts.filter(item => item.level === '精选' || item.rating >= 4).sort((a, b) => rankScore(b) - rankScore(a)).slice(0, 3)
      ];
      return selected.slice(0, 12);

    function itemMatchesScene(item, scene) {
      const haystack = normalizeForMatch([item.title, item.description, item.type, item.level, ...item.tags, ...item.filterGroups, ...item.filterTags].join(' '));
      return scene.keywords.some(keyword => haystack.includes(normalizeForMatch(canonicalTag(keyword))));
    }

      const scene = sceneDefs.find(item => item.id === sceneId);

        .filter(item => itemMatchesScene(item, scene))
        .filter(item => !state.query || item.searchText.includes(state.query.toLowerCase()))
        .sort((a, b) => rankScore(b) - rankScore(a));

      const scene = sceneDefs.find(item => item.id === state.scene);
      if (!scene) {
        container.classList.remove('active');
        container.innerHTML = '';
        return;
      }

      const groups = [
        ['tools', '推荐工具'],
        ['workflows', '相关工作流'],
        ['prompts', '可复制提示词']
      ].map(([moduleName, title]) => {
        const items = getSceneItems(scene.id, moduleName).slice(0, moduleName === 'tools' ? 12 : 6);
        if (!items.length) return '';
        return '<section class="section">' +
          '<div class="section-head"><div><h2 class="section-title">' + escapeHTML(title) + '</h2>' +
          '<p class="section-desc">' + escapeHTML(scene.title) + ' · ' + items.length + ' 条</p></div></div>' +
          '<div class="scene-grid">' + items.map(createCard).join('') + '</div>' +
          '</section>';
      }).join('');

      const total = getSceneItems(scene.id).length;
      container.classList.add('active');
      container.innerHTML =
        '<div class="scene-banner">' +
        '<div><h2 class="section-title">' + escapeHTML(scene.title) + '</h2>' +
        '<p class="section-desc">' + escapeHTML(scene.desc) + ' · 当前聚合 ' + total + ' 条内容</p></div>' +
        '<button class="filter-btn scene-reset" id="clearScene">返回全部内容</button>' +
        '</div>' +
        (groups || '<div class="empty"><div class="empty-icon">🔍</div><p>当前场景暂无匹配内容</p></div>');
      document.getElementById('clearScene').addEventListener('click', () => {
        state.scene = 'all';
        render();
      });
      bindCards(container);
    }

    function renderMaintenance() {
      const section = document.getElementById('maintenanceSection');
      if (!section.classList.contains('active')) return;
      const items = allItems();
      const lowCompleteness = items
        .filter(item => item.completenessScore < 60)
        .sort((a, b) => a.completenessScore - b.completenessScore)
        .slice(0, 12);
      const manualCount = Array.from(manualFeatured).length;

      section.innerHTML =
        '<div class="section-head"><div><h2 class="section-title">维护状态</h2>' +
        '<p class="section-desc">用于检查同步、数据完整度和本地精选标记</p></div>' +
        '<button class="filter-btn" id="exportData">导出当前 JSON</button></div>' +
        '<div class="maintenance-grid">' +
        '<div class="maintenance-item"><div class="maintenance-label">数据来源</div><div class="maintenance-value">' + escapeHTML(syncStatus.source) + '</div></div>' +
        '<div class="maintenance-item"><div class="maintenance-label">同步时间</div><div class="maintenance-value">' + escapeHTML(syncStatus.syncedAt || '未同步') + '</div></div>' +
        '<div class="maintenance-item"><div class="maintenance-label">API 端点</div><div class="maintenance-value">' + escapeHTML(syncStatus.endpoint || '未连接') + '</div></div>' +
        '<div class="maintenance-item"><div class="maintenance-label">记录数量</div><div class="maintenance-value">' + items.length + ' 条</div></div>' +
        '<div class="maintenance-item"><div class="maintenance-label">人工精选</div><div class="maintenance-value">' + manualCount + ' 条</div></div>' +
        '</div>' +
        (syncStatus.warning ? '<p class="section-desc">同步提示：' + escapeHTML(syncStatus.warning) + '</p>' : '') +
        '<div class="detail-label">低完整度记录</div>' +
        '<div class="maintenance-list">' + (lowCompleteness.length ? lowCompleteness.map(item =>
          '<div class="maintenance-record"><strong>' + escapeHTML(item.title) + '</strong>' +
          escapeHTML(moduleMeta[item.module].title) + ' · 完整度 ' + item.completenessScore + '% · ' + escapeHTML(item.level) + '</div>'
        ).join('') : '<div class="maintenance-record"><strong>暂无</strong>当前没有低完整度记录。</div>') + '</div>';

      document.getElementById('exportData').addEventListener('click', exportCurrentData);
    }

    function exportCurrentData() {
      const payload = {
        exportedAt: new Date().toISOString(),
        syncStatus,
        manualFeatured: Array.from(manualFeatured),
        data: dataStore
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'lu-ai-toolkit-export.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('已导出当前 JSON');
    }

    function toggleManualFeatured(uid) {
      if (manualFeatured.has(uid)) manualFeatured.delete(uid);
      else manualFeatured.add(uid);
      localStorage.setItem('manualFeaturedItems', JSON.stringify(Array.from(manualFeatured)));
      refreshLevels();
      closeModal();
      render();
      showToast(manualFeatured.has(uid) ? '已标记精选' : '已取消精选');
    }

    function createCard(item) {
      const grad = getGradient(item.type);
      const icon = getIcon(item.type);
      const tags = item.tags.slice(0, 4).map((tag, index) =>
        '<span class="card-tag' + (index === 0 ? ' primary' : '') + '">' + escapeHTML(tag) + '</span>'
      ).join('');
      const date = item.date ? '<span>' + escapeHTML(item.date) + '</span>' : '<span></span>';
      const link = item.links.length ? '<a href="' + escapeHTML(normalizeUrl(item.links[0])) + '" target="_blank" rel="noopener" class="card-link" onclick="event.stopPropagation()">访问 →</a>' : '';
      const copy = item.module === 'prompts'
        ? '<button class="card-link copy-card" data-copy="' + escapeHTML(item.description) + '" onclick="event.stopPropagation()">复制</button>'
        : link;

      return '<div class="card" data-uid="' + escapeHTML(item.uid) + '">' +
        '<span class="level-badge ' + levelClass(item.level) + '">' + escapeHTML(item.level) + '</span>' +
        '<div class="card-img" style="background:' + grad + ';display:flex;align-items:center;justify-content:center;">' +
        '<span style="font-family:\'Noto Serif SC\',serif;font-size:2rem;font-weight:700;color:rgba(255,255,255,0.92);letter-spacing:0;">' + escapeHTML(icon) + '</span></div>' +
        '<div class="card-body">' +
        '<h3 class="card-title">' + escapeHTML(item.title) + '</h3>' +
        '<div class="card-tags">' + tags + '</div>' +
        (item.description ? '<p class="card-desc">' + escapeHTML(item.description) + '</p>' : '') +
        '<div class="card-footer">' +
        '<span class="card-stars">' + (item.module === 'workflows' ? date : escapeHTML(getStars(item.rating))) + '</span>' +
        copy +
        '</div></div></div>';
    }

    function bindCards(root) {
      root.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.uid));
      });
      root.querySelectorAll('.copy-card').forEach(btn => {
        btn.addEventListener('click', event => {
          event.stopPropagation();
          copyText(btn.dataset.copy);
        });
      });
    }

    function render() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const meta = moduleMeta[state.module];
      document.getElementById('moduleDesc').textContent = meta.desc;
      document.getElementById('searchInput').placeholder = state.module === 'tools'
        ? '搜索工具名称、类型或使用场景...'
        : state.module === 'workflows'
          ? '搜索工作流、软件或场景...'
          : '搜索提示词、作者或类型...';

      document.getElementById('controlBar').style.display = state.scene === 'all' ? 'flex' : 'none';
      document.getElementById('featuredSection').style.display = state.scene === 'all' ? 'block' : 'none';
      document.getElementById('listSection').style.display = state.scene === 'all' ? 'block' : 'none';

      renderControls();
      renderFeatured();
      renderSceneNav();
      renderSceneResults();
      renderMaintenance();

      if (state.scene !== 'all') {
        renderStats(getSceneItems(state.scene));
        return;
      }

      currentItems = getFilteredItems();
      renderStats(currentItems);
      document.getElementById('listTitle').textContent = meta.title;
      document.getElementById('listMeta').textContent = state.query || state.type !== 'all' || state.tag !== 'all' || state.rating !== 'all'
        ? '筛选结果：' + currentItems.length + ' 条'
        : '全部内容：' + currentItems.length + ' 条';

      if (!currentItems.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        empty.querySelector('p').textContent = meta.empty;
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = currentItems.map(createCard).join('');
      bindCards(grid);
    }

    function findItem(uid) {
      return Object.values(dataStore).flat().find(item => item.uid === uid);
    }

    function openModal(uid) {
      const item = findItem(uid);
      if (!item) return;
      const modal = document.getElementById('modal');
      document.getElementById('modalHero').innerHTML =
        '<div style="width:100%;aspect-ratio:16/8;background:' + getGradient(item.type) + ';display:flex;align-items:center;justify-content:center;">' +
        '<span style="font-family:\'Noto Serif SC\',serif;font-size:3.6rem;font-weight:700;color:rgba(255,255,255,0.9);">' + escapeHTML(getIcon(item.type)) + '</span></div>';

      const tagHtml = item.tags.map(tag => '<span class="card-tag">' + escapeHTML(tag) + '</span>').join('');
      const dateHtml = item.date ? '<div class="detail-label">时间</div><div class="modal-desc">' + escapeHTML(item.date) + '</div>' : '';
      const authorHtml = item.author ? '<div class="detail-label">作者</div><div class="modal-desc">' + escapeHTML(item.author) + '</div>' : '';
      const ratingHtml = item.module !== 'workflows' ? '<div class="detail-label">评分</div><div class="modal-desc">' + escapeHTML(getStars(item.rating)) + '</div>' : '';
      const statusHtml = item.status ? '<div class="detail-label">使用状态</div><div class="modal-desc">' + escapeHTML(item.status) + '</div>' : '';
      const levelHtml = '<div class="detail-label">内容状态</div><div class="detail-row">' +
        '<span class="card-tag primary">' + escapeHTML(item.level) + '</span>' +
        '<span class="card-tag">完整度 ' + escapeHTML(item.completenessScore) + '%</span>' +
        '</div>';
      const manualHtml = '<div class="detail-label">维护操作</div><div class="detail-row">' +
        '<button class="copy-btn" onclick="toggleManualFeatured(\'' + escapeHTML(item.uid) + '\')">' +
        (manualFeatured.has(item.uid) ? '取消人工精选' : '标记为人工精选') +
        '</button></div>';
      const linksHtml = item.links.length ? '<div class="detail-label">链接</div><div class="detail-row">' + linkButtons(item.links) + '</div>' : '';
      const promptHtml = item.module === 'prompts'
        ? '<div class="detail-label">完整提示词</div><button class="copy-btn" onclick="copyTextFromModal()">复制提示词</button><div class="prompt-box" id="promptText">' + escapeHTML(item.description) + '</div>'
        : '<div class="detail-label">内容</div><p class="modal-desc">' + escapeHTML(item.description) + '</p>';

      document.getElementById('modalInfo').innerHTML =
        '<h2 class="modal-title">' + escapeHTML(item.title) + '</h2>' +
        '<div class="detail-row">' + tagHtml + '</div>' +
        levelHtml + authorHtml + dateHtml + ratingHtml + statusHtml + promptHtml + linksHtml + manualHtml;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function copyText(text) {
      const value = cleanText(text);
      if (!value) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).then(() => showToast('已复制提示词'));
        return;
      }
      const input = document.createElement('textarea');
      input.value = value;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.focus();
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast('已复制提示词');
    }

    function copyTextFromModal() {
      const el = document.getElementById('promptText');
      if (el) copyText(el.textContent);
    }

    function resetFilters(keepQuery) {
      state.type = 'all';
      state.tag = 'all';
      state.rating = 'all';
      state.sort = 'default';
      if (!keepQuery) {
        state.query = '';
        document.getElementById('searchInput').value = '';
      }
    }

    document.querySelectorAll('.module-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.module-tab').forEach(item => item.classList.remove('active'));
        tab.classList.add('active');
        state.module = tab.dataset.module;
        state.scene = 'all';
        resetFilters(true);
        render();
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      state.query = e.target.value.trim();
      render();
    });

    document.getElementById('typeFilter').addEventListener('change', e => {
      state.type = e.target.value;
      render();
    });

    document.getElementById('tagFilter').addEventListener('change', e => {
      state.tag = e.target.value;
      render();
    });

    document.getElementById('ratingFilter').addEventListener('change', e => {
      state.rating = e.target.value;
      render();
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      state.sort = e.target.value;
      render();
    });

    document.getElementById('clearFilters').addEventListener('click', () => {
      resetFilters(false);
      render();
    });

    document.getElementById('maintenanceToggle').addEventListener('click', () => {
      document.getElementById('maintenanceSection').classList.toggle('active');
      renderMaintenance();
    });

    document.getElementById('filterToggle').addEventListener('click', () => {
      const bar = document.getElementById('controlBar');
      bar.classList.toggle('collapsed');
      document.getElementById('filterToggle').textContent = bar.classList.contains('collapsed') ? '展开筛选' : '收起筛选';
    });

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    render();
    loadRemoteResources();
  </script>
</body>
</html>
